{% extends "ledger/base.html" %}
{% block page_title %}Set New Password{% endblock %}
{% block content %}
{% if validlink %}
<form method="POST">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Change password</button>
</form>
{% else %}
<p>Invalid password reset link!</p>
{% endif %}
{% endblock %}
