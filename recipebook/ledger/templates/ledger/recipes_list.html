{% extends "ledger/base.html" %}
{% block page_title %}All Recipes{% endblock %}
{% block content %}
{% if user.is_authenticated %}
<a href="{% url 'recipe-create' %}">Add Recipe</a>
{% endif %}
<ul>
  {% for recipe in object_list %}
  <li>
    <a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
